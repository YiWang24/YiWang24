name: Update Project Screenshots

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture project screenshots
        run: node .github/scripts/capture-project-screenshots.mjs

      - name: Commit and push updated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects/*.png

          if git diff --cached --quiet; then
            echo "No screenshot changes to commit"
            exit 0
          fi

          git commit -m "chore: refresh project screenshots"
          git push
